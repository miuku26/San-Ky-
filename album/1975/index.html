<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album 1975</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="canvas-container">

        <img
            class="hero-bg"
            src="./assets/vien.png"
            alt="Background"
            draggable="false"
        >

        <div class="left-bar"></div>

        <div
            class="year-tab tab-1975"
            data-property-1="Active"
        >
            <span class="text-1975">
                1975
            </span>
        </div>

        <div
            class="year-tab tab-1990"
            data-property-1="Default"
        >
            <span class="text-1990">
                1990
            </span>
        </div>

        <div
            class="year-tab tab-2025"
            data-property-1="Default"
        >
            <span class="text-2025">
                2025
            </span>
        </div>

        <div class="right-bar"></div>

        

        <div class="quote-container">

            <div class="quote-text">
                Woke up at 4 AM to place a brick in line for lard.
                Getting that small slab felt bigger than winning the lottery
            </div>

        </div>

        <div
            class="photo-frame timeline-trigger"
            id="timeline1975"
            data-timeline="1975"
            data-property-1="Default"
        >
            <img
                src="./assets/anh1975.png"
                alt="Main Photo 1975"
                draggable="false"
            >
        </div>

        <img
            class="img-1 draggable"
            src="./assets/1975tag.png"
            alt="1975 Tag"
            draggable="false"
        >

        <img
            class="img-2 draggable"
            src="./assets/tem_luong_thuc.png"
            alt="Tem luong thuc"
            draggable="false"
        >

        <img
            class="img-3 draggable"
            src="./assets/ghim.png"
            alt="Ghim 1"
            draggable="false"
        >

        <img
            class="img-4 draggable"
            src="./assets/ghim.png"
            alt="Ghim 2"
            draggable="false"
        >

        <img
            class="img-5 draggable"
            src="./assets/tape.png"
            alt="Tape 1"
            draggable="false"
        >

        <img
            class="img-6 draggable"
            src="./assets/tape.png"
            alt="Tape 2"
            draggable="false"
        >

        <img
            class="img-7 draggable"
            src="./assets/anh_1.png"
            alt="Photo 1"
            draggable="false"
        >

        <img
            class="img-8 draggable"
            src="./assets/anh_2.png"
            alt="Photo 2"
            draggable="false"
        >

        <img
            class="img-9 draggable"
            src="./assets/cui.png"
            alt="Cui"
            draggable="false"
        >

        <img
            class="img-10 draggable"
            src="./assets/den_dau.png"
            alt="Den dau"
            draggable="false"
        >

        <img
            class="img-11 draggable"
            src="./assets/tape.png"
            alt="Tape 3"
            draggable="false"
        >

        <img
            class="img-12 draggable"
            src="./assets/tape.png"
            alt="Tape 4"
            draggable="false"
        >

        <img
            class="img-13 draggable"
            src="./assets/bathoa.png"
            alt="Bat hoa"
            draggable="false"
        >

    </div>

    <script src="./script.js"></script>

</body>

</html>
