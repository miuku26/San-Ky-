<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album 1990</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="canvas-container">

        <img
            class="hero-bg"
            src="./assets/vien.png"
            alt="Background"
            draggable="false"
        >

        <div class="left-bar"></div>

        <div
            class="year-tab tab-1975"
            data-property-1="Default"
        >
            <span class="text-1975">
                1975
            </span>
        </div>

        <div
            class="year-tab tab-1990"
            data-property-1="Active"
        >
            <span class="text-1990">
                1990
            </span>
        </div>

        <div
            class="year-tab tab-2025"
            data-property-1="Default"
        >
            <span class="text-2025">
                2025
            </span>
        </div>

        <div class="right-bar"></div>

        <div class="quote-container">

            <div class="quote-text">
                A rich pot of caramelized pork for Tet this year.
                No more dark smoke clinging to the kitchen walls
            </div>

        </div>

        <div
            class="photo-frame timeline-trigger"
            id="timeline1990"
            data-timeline="1990"
            data-property-1="Default"
        >
            <img
                src="./assets/anh1990.png"
                alt="Main Photo 1990"
                draggable="false"
            >
        </div>

        <img
            class="img-1 draggable"
            src="./assets/phich_nuoc.png"
            alt="Phich nuoc"
            draggable="false"
        >

        <img
            class="img-2 draggable"
            src="./assets/clipper1.png"
            alt="Clipper 1"
            draggable="false"
        >

        <img
            class="img-3 draggable"
            src="./assets/noi_thit_kho.png"
            alt="Noi thit kho"
            draggable="false"
        >

        <img
            class="img-4 draggable"
            src="./assets/1994.png"
            alt="1994"
            draggable="false"
        >

        <img
            class="img-5 draggable"
            src="./assets/1990tag.png"
            alt="1990 Tag"
            draggable="false"
        >

        <img
            class="img-6 draggable"
            src="./assets/tape.png"
            alt="Tape"
            draggable="false"
        >

        <img
            class="img-7 draggable"
            src="./assets/pen.png"
            alt="Pen"
            draggable="false"
        >

        <img
            class="img-8 draggable"
            src="./assets/anh_1990_2.png"
            alt="Photo 1990 2"
            draggable="false"
        >

        <img
            class="img-9 draggable"
            src="./assets/note1.png"
            alt="Note"
            draggable="false"
        >

        <img
            class="img-10 draggable"
            src="./assets/anh_the.png"
            alt="Anh the"
            draggable="false"
        >

        <img
            class="img-11 draggable"
            src="./assets/clipper1.png"
            alt="Clipper 2"
            draggable="false"
        >

    </div>

    <script src="./script.js"></script>

</body>

</html>
