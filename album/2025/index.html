<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album 2025</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="canvas-container">

        <img
            class="hero-bg"
            src="./assets/vien.png"
            alt="Background"
            draggable="false"
        >

        <div class="left-bar"></div>

        <div
            class="year-tab tab-1975"
            data-property-1="Default"
        >
            <span class="text-1975">
                1975
            </span>
        </div>

        <div
            class="year-tab tab-1990"
            data-property-1="Default"
        >
            <span class="text-1990">
                1990
            </span>
        </div>

        <div
            class="year-tab tab-2025"
            data-property-1="Active"
        >
            <span class="text-2025">
                2025
            </span>
        </div>

        <div class="right-bar"></div>


        <div class="title-container">

            <div class="title-text">
                Dinner away from home
            </div>

        </div>

        <img
            class="img-1 draggable"
            src="./assets/2025tag.png"
            alt="2025 Tag"
            draggable="false"
        >

        <img
            class="img-2 draggable"
            src="./assets/asset 2025.png"
            alt="2025 Asset"
            draggable="false"
        >

        <img
            class="img-3 draggable"
            src="./assets/mh.png"
            alt="Photo MH"
            draggable="false"
        >

        <img
            class="img-4 draggable"
            src="./assets/clipper2.png"
            alt="Clipper"
            draggable="false"
        >

        <img
            class="img-5 timeline-trigger"
            id="timeline2025"
            data-timeline="2025"
            src="./assets/anh2025.png"
            alt="Main Photo 2025"
            draggable="false"
        >

        <img
            class="img-6 draggable"
            src="./assets/note 3.png"
            alt="Note"
            draggable="false"
        >

        <img
            class="img-7 draggable"
            src="./assets/ramen.png"
            alt="Ramen"
            draggable="false"
        >

        <img
            class="img-8 draggable"
            src="./assets/tape.png"
            alt="Tape 1"
            draggable="false"
        >

        <img
            class="img-9 draggable"
            src="./assets/tape.png"
            alt="Tape 2"
            draggable="false"
        >

    </div>

    <script src="./script.js"></script>

</body>

</html>
